<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet Connection</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<style>
    .card{
        box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
    }
   #c2{
    visibility: hidden;
    text-align: center;
   }
</style>
<body>
    <div class="container">
        <div class="card" id="c1">
             <div class="card-body" align="center" >
                 <h1 class="card-title" style="font-size:30px;">No Internet Connection</h1>
                 <img src="https://static.vecteezy.com/system/resources/previews/007/957/403/non_2x/failure-wifi-icon-offline-symbol-no-internet-connection-icon-simple-wifi-signal-sign-disconnected-wireless-internet-signal-problem-access-illustration-isolated-on-white-background-vector.jpg" alt="No Internet" style="width: 150px; height: 150px;">
                 <p style="font-size: 20px;">Please check if your device is connected to the internet or not.</p>
                 <button class="btn btn-primary" style="inset-inline:block;" onclick="LOL()">Try Again</button>
             </div>
        </div>
    </div>
    <div class="container" id="c2">
    <div class="spinner-border" id="spinner"></div><br><span>Loading...</span></div>
    <script>
        function LOL(){
            document.getElementById("c2").style.visibility = "visible";
              document.getElementById("c1").style.visibility = "hidden";
            setTimeout(function(){
                document.getElementById("c2").style.visibility = "hidden";
                
            }, randomInt);
        }
        const min = 1;
        const max = 1000;
        const randomInt = Math.floor(Math.random() * (max - min + 1)) + min;
    </script>
</body>
</html>
