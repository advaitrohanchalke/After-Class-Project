<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostrap Container</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<style>
    .col-4{
        border: 1px solid black;
        padding: 5px;
        text-align: center;
        font-size:20px;
        
    }
    .btn{
        padding: 10px;
        font-size: 20px;
    }
</style>
<body class="container">
   <h1 style="font-size: 50px;">My Hobbies</h1>
   <div class="row">
    <div class="col-4">Hobby 1</div>
    <div class="col-4">Hobby 2</div>
    <div class="col-4">Hobby 3</div>
   </div>
   <div class="container-fluid">
    <ol>
     <li style="font-size: 30px;">Hobby 1</li>
     <p style="font-size: 20px;">My hobby 1 is reading books.</p>
     <li style="font-size: 30px;">Hobby 2</li>
        <p style="font-size: 20px;">My hobby 2 is playing sports.</p>
     <li style="font-size: 30px;">Hobby 3</li>
        <p style="font-size: 20px;">My hobby 3 is listening to music.</p>
    </ol>
   </div>
   <h1 style="font-size:50px;">Boostrap Badges</h1>
   <button class="btn btn-primary">Primary</button>
   <button class="btn btn-secondary">Secondary</button>
   <button class="btn btn-warning">Warning</button>
   <button class="btn btn-success">Success</button>
</body>
</html>
