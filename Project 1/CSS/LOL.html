<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Box</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        .open-btn {
            padding: 12px 24px;
            border: none;
            background: #007bff;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .popup-box {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .popup-box h2 {
            margin-top: 0;
        }
        .close-btn {
            margin-top: 16px;
            padding: 10px 20px;
            border: none;
            background: #dc3545;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <button class="open-btn" id="openPopup">Open Popup</button>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <h2>Popup Box</h2>
            <p>This is a simple popup box. Click close or outside to dismiss it.</p>
            <button class="close-btn" id="closePopup">Close</button>
        </div>
    </div>

    <script>
        const openBtn = document.getElementById('openPopup');
        const closeBtn = document.getElementById('closePopup');
        const overlay = document.getElementById('popupOverlay');

        openBtn.addEventListener('click', () => {
            overlay.style.display = 'flex';
        });

        closeBtn.addEventListener('click', () => {
            overlay.style.display = 'none';
        });

        overlay.addEventListener('click', (event) => {
            if (event.target === overlay) {
                overlay.style.display = 'none';
            }
        });
    </script>
</body>
</html>
