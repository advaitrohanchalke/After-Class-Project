        function liveUpdate() {
            const val = document.getElementById("lol").value;

            if (val === "Coffee") {

    <!-- The empty container where the list will go -->
    <div id="listContainer"></div>
    
    <button onclick="generateList()">Load Menu</button>
    
    <script>
        function generateList() {
            // 1. Your data (Array)
            const items = ["Home", "About", "Services", "Contact"];

            // 2. Start a string with the opening <ul> tag
            let listHTML = "<ul>";

            // 3. Loop through the array and add <li> for each item
            items.forEach(function (item) {
                listHTML += "<li>" + item + "</li>";
            });

            // 4. Close the <ul> tag
            listHTML += "</ul>";

            // 5. Inject the whole string into the div
            document.getElementById("listContainer").innerHTML = listHTML;
        }
    </script>
